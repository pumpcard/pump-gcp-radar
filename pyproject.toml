[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-gcp-radar"
version = "0.1.0"
description = "gcp-radar with a one-command push of inventory and billing CSVs to Pump"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "Mor Michaeli"}]
dependencies = ["gcp-radar>=1.3.0,<1.4"]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

# gcp-radar's CLI, plus `run --upload-token`.
[project.scripts]
pump-gcp-radar = "pump_gcp_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
